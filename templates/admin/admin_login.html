<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - DoctorApp</title>
<link rel="icon" href="{{ url_for('static', filename='img/app-icon.png') }}">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #12303b 0%, #1f6572 55%, #2a7f8e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .25); width: 100%; max-width: 400px; padding: 36px 32px; }
    .login-card img { width: 64px; height: 64px; display: block; margin: 0 auto 14px; }
    .login-card h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
    .login-card p.sub { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 22px; }
    .flash { padding: 11px 14px; border-radius: 9px; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
    .flash-success { background: #e8f7ee; color: #15803d; }
    .flash-danger { background: #fdeaea; color: #dc2626; }
    label { display: block; font-size: 13px; font-weight: 700; color: #4b5563; margin-bottom: 5px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #d9e2e8; border-radius: 10px; font-size: 15px; margin-bottom: 16px; font-family: inherit; }
    input:focus { outline: none; border-color: #2a7f8e; box-shadow: 0 0 0 3px rgba(42, 127, 142, .15); }
    .btn-login { width: 100%; background: #2a7f8e; color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    .btn-login:hover { background: #1f6572; }
    a.back { display: block; text-align: center; color: #6b7280; font-size: 13.5px; text-decoration: none; font-weight: 600; }
    a.back:hover { color: #2a7f8e; }
    .hint { text-align: center; margin-top: 16px; font-size: 12.5px; color: #9ca3af; background: #f6f9fb; border: 1px dashed #d9e2e8; border-radius: 9px; padding: 9px; }
</style>
</head>
<body>
    <form class="login-card" method="post">
        <img src="{{ url_for('static', filename='img/app-icon.png') }}" alt="DoctorApp">
        <h1>Admin Panel</h1>
        <p class="sub">Sign in to manage doctors, hospitals &amp; clinics</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required autofocus>
        <label>Password</label>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn-login" type="submit">Login</button>
        <a class="back" href="{{ url_for('index') }}">&larr; Back to website</a>
        <div class="hint">Default login: admin / admin123</div>
    </form>
</body>
</html>
