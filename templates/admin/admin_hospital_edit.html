{% extends "admin/admin_base.html" %}
{% block pagetitle %}Edit Hospital / Clinic{% endblock %}
{% block title %}Edit Hospital / Clinic{% endblock %}
{% block content %}
<div class="card">
    <h2>Edit Hospital / Clinic</h2>
    <form method="post">
        <div class="frow">
            <div>
                <label class="flabel">Name *</label>
                <input type="text" name="name" value="{{ hospital['name'] }}" required>
            </div>
            <div>
                <label class="flabel">City *</label>
                <select name="city" required>
                    {% for c in cities %}
                        <option value="{{ c['name'] }}" {% if c['name'] == hospital['city_name'] %}selected{% endif %}>{{ c['name'] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="frow">
            <div>
                <label class="flabel">Address</label>
                <input type="text" name="address" value="{{ hospital['address'] or '' }}">
            </div>
            <div class="frow" style="grid-template-columns:1fr 1fr;gap:14px;">
                <div>
                    <label class="flabel">Phone</label>
                    <input type="text" name="phone" value="{{ hospital['phone'] or '' }}">
                </div>
                <div>
                    <label class="flabel">Rating</label>
                    <input type="number" name="rating" min="0" max="5" step="0.1" value="{{ hospital['rating'] }}">
                </div>
            </div>
        </div>
        <label class="flabel">OPD Schedules (JSON)</label>
        <textarea name="ot_schedules" rows="4" placeholder='[{"day": "Monday", "startTime": "08:00 AM", "endTime": "04:00 PM", "opdSpecialty": "General", "doctorName": "Dr. X"}]'>{{ hospital['ot_schedules'] }}</textarea>
        <div class="actions-top" style="justify-content:flex-start;padding:0;margin-top:14px;">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn" href="{{ url_for('admin_hospitals') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
